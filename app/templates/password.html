{% extends "base.html" %}{% block content %}
<form method="post" class="card form narrow">
  <h1>Change password</h1>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Current password <input name="old" type="password" autocomplete="current-password" required></label>
  <label>New password <input name="new" type="password" minlength="8" autocomplete="new-password" required></label>
  <button class="btn primary block">Change</button>
</form>{% endblock %}
